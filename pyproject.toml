[project]
name = "odin-bot"
version = "3.66.0"
description = "Odin — autonomous executor Discord bot, Heimdall-pattern with extended capability surface"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "discord.py>=2.3,<3",
    "aiohttp>=3.9",
    "aiofiles>=24.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "pydantic>=2.0",
    "croniter>=2.0.0",
    "fastembed>=0.8.0",
    "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
# PDF text extraction (analyze_pdf tool)
pdf = ["PyMuPDF>=1.24.0"]
# Browser automation (browser_screenshot, browser_click, etc.)
browser = ["playwright>=1.40.0"]
# All optional executor features
all = ["odin-bot[pdf,browser]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "ruff",
    "aioresponses>=0.7",
    # Type gate (RFC-005): checker + stubs pinned so CI findings are
    # deterministic — upgrades are deliberate PRs, never ambient drift.
    "mypy==2.1.0",
    "types-aiofiles==25.1.0.20260518",
    "types-PyYAML==6.0.12.20260518",
    "types-croniter==6.2.3.20260704",
]

[project.scripts]
odin = "src.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long lines inside multi-line prompt/template string literals cannot be
# wrapped without changing the string bytes (prompt content is behavior),
# and a "#" inside a string is content, not a noqa comment. E501 is
# therefore suppressed for the template-bearing files as a whole.
"src/llm/system_prompt.py" = ["E501"]
"src/learning/reflector.py" = ["E501"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
