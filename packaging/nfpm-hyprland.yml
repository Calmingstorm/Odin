# Optional target-ABI package. Set HYPRLAND_DEPENDENCY to an exact distro version
# constraint. Never add this package or Hyprland to the Odin headless base.
name: odin-hyprland
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
maintainer: Odin Maintainers <odin@localhost>
description: |
  Optional native Hyprland capture/input and compositor-scope helpers for Odin.
  Exact compositor-ABI build; inert installation, explicit operator setup only.
license: GPL-3.0-or-later
depends:
  - odin
  - ${HYPRLAND_DEPENDENCY}
contents:
  - src: ./build/hyprland/odin-hyprland-input
    dst: /usr/local/libexec/odin-hyprland-input
    file_info: {owner: root, group: root, mode: 0755}
  - src: ./build/hyprland/odin-hyprland-capture
    dst: /usr/local/libexec/odin-hyprland-capture
    file_info: {owner: root, group: root, mode: 0755}
  - src: ./build/hyprland/${SCOPE_PLUGIN_FILENAME}
    dst: /usr/local/lib/odin/${SCOPE_PLUGIN_FILENAME}
    file_info: {owner: root, group: root, mode: 0644}
  - src: ./build/hyprland/build-identity.json
    dst: /usr/local/share/doc/odin-hyprland/build-identity.json
    file_info: {owner: root, group: root, mode: 0644}
  - src: ./docs/computer-use/HYPRLAND-OPERATOR-R32.md
    dst: /usr/local/share/doc/odin-hyprland/HYPRLAND-OPERATOR-R32.md
    file_info: {owner: root, group: root, mode: 0644}
  - src: ./docs/computer-use/OPERATOR.md
    dst: /usr/local/share/doc/odin-hyprland/OPERATOR.md
    file_info: {owner: root, group: root, mode: 0644}
  - src: ./docs/computer-use/PACKAGING.md
    dst: /usr/local/share/doc/odin-hyprland/PACKAGING.md
    file_info: {owner: root, group: root, mode: 0644}
  - src: ./docs/computer-use/RECOVERY.md
    dst: /usr/local/share/doc/odin-hyprland/RECOVERY.md
    file_info: {owner: root, group: root, mode: 0644}
