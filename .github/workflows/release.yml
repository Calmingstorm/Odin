name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set version in pyproject.toml
        run: sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" pyproject.toml

      - name: Install nfpm
        run: |
          set -euo pipefail
          file=nfpm_2.46.0_amd64.deb
          curl --fail --show-error --silent --location \
            "https://github.com/goreleaser/nfpm/releases/download/v2.46.0/$file" \
            --output "$file"
          echo '8d50e304492983e4b76b844216e3d2a23dee48e98a9c9ac1e3fafff42bc2f9a9  nfpm_2.46.0_amd64.deb' | sha256sum --check --strict
          sudo env DEBIAN_FRONTEND=noninteractive dpkg --install "$file"

      - name: Build matching optional computer helper
        run: |
          docker build -f packaging/computer-builder.Containerfile -t odin-computer-builder .
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD:/source" odin-computer-builder

      - name: Build .deb package
        run: |
          mkdir -p dist
          nfpm package \
            --config packaging/nfpm.yml \
            --packager deb \
            --target dist/
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Mandatory disposable-container package smoke
        run: |
          set -euo pipefail
          package="$(realpath dist/*.deb)"
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            -e ODIN_PACKAGE_SMOKE_DISPOSABLE=yes \
            -v "$PWD:/workspace:ro" \
            -v "$package:/tmp/odin.deb:ro" \
            debian:bookworm-slim \
            bash /workspace/packaging/smoke-computer-install.sh /tmp/odin.deb headless

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb
          retention-days: 5

  create-release:
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: dist/

      # Replaces the old "Generate changelog" step (git log subjects) — Aaron's standard 2026-09-16:
      # the release body is the curated CHANGELOG.md section for this tag; commits only as an appendix.
      - name: Extract changelog section
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md is missing; every release needs a curated changelog section" >&2
            exit 1
          fi
          # Exact heading match: "## [VERSION]" followed by end-of-line or a space
          # (Keep a Changelog writes "## [X.Y.Z] - YYYY-MM-DD"). The version is
          # compared literally, never as a regular expression. The section ends
          # at the next "## [" heading.
          awk -v prefix="## [$VERSION]" '
            !grab {
              if (index($0, prefix) == 1 && (length($0) == length(prefix) || substr($0, length(prefix) + 1, 1) == " ")) {
                grab = 1; print
              }
              next
            }
            /^## \[/ { exit }
            { print }
          ' CHANGELOG.md > /tmp/section.md
          if [ ! -s /tmp/section.md ]; then
            echo "CHANGELOG.md has no '## [$VERSION]' section; write the changelog before tagging" >&2
            exit 1
          fi
          if ! tail -n +2 /tmp/section.md | grep -q '[^[:space:]]'; then
            echo "CHANGELOG.md section '## [$VERSION]' has no content beyond its heading" >&2
            exit 1
          fi
          # Commit appendix: from the nearest release tag reachable from this tag's
          # parent (the actual predecessor on this line of history), not the
          # highest version number in the repository.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            cat /tmp/section.md
            echo
            echo "<details><summary>Commits</summary>"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "_${PREV_TAG}..${GITHUB_REF_NAME}_"
              echo
              git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${GITHUB_REF_NAME}"
            else
              git log --pretty=format:"- %s (%h)" -n 50 "${GITHUB_REF_NAME}"
            fi
            echo
            echo
            echo "</details>"
          } > /tmp/changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Odin ${{ github.ref_name }}
          body_path: /tmp/changelog.txt
          files: dist/*.deb
          generate_release_notes: false
