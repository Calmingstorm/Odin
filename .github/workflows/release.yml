name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set version in pyproject.toml
        run: sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" pyproject.toml

      - name: Install nfpm
        run: |
          curl -sLO "https://github.com/goreleaser/nfpm/releases/download/v2.46.0/nfpm_2.46.0_amd64.deb"
          sudo dpkg -i nfpm_2.46.0_amd64.deb

      - name: Build matching optional computer helper
        run: |
          docker build -f packaging/computer-builder.Containerfile -t odin-computer-builder .
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD:/source" odin-computer-builder

      - name: Build .deb package
        run: |
          mkdir -p dist
          nfpm package \
            --config packaging/nfpm.yml \
            --packager deb \
            --target dist/
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb
          retention-days: 5

  create-release:
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: dist/

      # Replaces the old "Generate changelog" step (git log subjects) — Aaron's standard 2026-09-16:
      # the release body is the curated CHANGELOG.md section for this tag; commits only as an appendix.
      - name: Extract changelog section
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md is missing; every release needs a curated changelog section" >&2
            exit 1
          fi
          # Section = from "## [VERSION]" up to the next "## [" heading (exclusive).
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; print; next }
            grab && $0 ~ "^## \\[" { exit }
            grab { print }
          ' CHANGELOG.md > /tmp/section.md
          if [ ! -s /tmp/section.md ]; then
            echo "CHANGELOG.md has no '## [$VERSION]' section; write the changelog before tagging" >&2
            exit 1
          fi
          PREV_TAG=$(git tag --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          {
            cat /tmp/section.md
            echo
            echo "<details><summary>Commits</summary>"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${GITHUB_REF_NAME}"
            else
              git log --pretty=format:"- %s (%h)" -n 50 "${GITHUB_REF_NAME}"
            fi
            echo
            echo
            echo "</details>"
          } > /tmp/changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Odin ${{ github.ref_name }}
          body_path: /tmp/changelog.txt
          files: dist/*.deb
          generate_release_notes: false
