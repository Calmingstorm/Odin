name: Tests

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run the suite
        run: pytest -q

  lint-no-new:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the gate merge-bases against the PR base ref
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The gate diffs findings from the SAME ruff binary on both trees, so
      # it is self-consistent across ruff releases; no version pin needed.
      - name: Install ruff
        run: pip install ruff
      - name: No new lint findings vs base
        run: python scripts/ci/lint_gate.py

  types-no-new:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the gate merge-bases against the PR base ref
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      # mypy needs the real dependency environment to resolve imports; the
      # checker + stubs are version-pinned in the dev extra so findings are
      # deterministic. Both trees are checked with HEAD's mypy + mypy.ini
      # (two-tree evaluation) — see scripts/ci/type_gate.py.
      - name: Install
        run: pip install -e ".[dev]"
      - name: No new type findings vs base
        run: python scripts/ci/type_gate.py

  coverage-no-drop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      # Per-file missed-line-count ceiling vs the committed baseline
      # (coverage-baseline.json) — the dark may not grow. Total percent is
      # reported, never gated. See scripts/ci/coverage_gate.py (RFC-006).
      - name: No coverage regressions vs baseline
        run: python scripts/ci/coverage_gate.py
