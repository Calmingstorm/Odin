name: Tests

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'odin-ci' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run the suite
        run: pytest -q

  browser-network-guard:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'odin-ci' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install browser test dependencies
        run: |
          pip install -e ".[dev,browser]"
          # Hosted images need system libs installed each run; the self-hosted
          # runner already has them (and its user has no passwordless sudo).
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            python -m playwright install chromium
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Exercise real Chromium request guard paths
        env:
          # The tests may skip on developer machines without Chromium, but this
          # job must fail rather than silently stop exercising the guard.
          ODIN_REQUIRE_BROWSER_TESTS: '1'
        run: |
          pytest -q \
            tests/test_browser_automation.py::test_real_public_page_loads_to_completion_through_request_guard \
            tests/test_browser_automation.py::test_real_browser_blocks_redirects_and_subresources_to_private_loopback

  lint-no-new:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'odin-ci' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the gate merge-bases against the PR base ref
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The gate diffs findings from the SAME ruff binary on both trees, so
      # it is self-consistent across ruff releases; no version pin needed.
      - name: Install ruff
        run: pip install ruff
      - name: No new lint findings vs base
        run: python scripts/ci/lint_gate.py

  types-no-new:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'odin-ci' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the gate merge-bases against the PR base ref
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      # mypy needs the real dependency environment to resolve imports; the
      # checker + stubs are version-pinned in the dev extra so findings are
      # deterministic. Both trees are checked with HEAD's mypy + mypy.ini
      # (two-tree evaluation) — see scripts/ci/type_gate.py.
      - name: Install
        run: pip install -e ".[dev]"
      - name: No new type findings vs base
        run: python scripts/ci/type_gate.py

  config-apply-classified:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'odin-ci' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      # The WebUI renders apply-mode badges from src/config/apply_registry.py.
      # A schema section with no entry would put the page back to guessing how
      # a setting reaches the running bot, which is the defect the config
      # campaign existed to remove. See scripts/ci/apply_registry_gate.py.
      - name: Every config section declares how it applies
        run: python scripts/ci/apply_registry_gate.py

  coverage-no-drop:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'odin-ci' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      # Per-file missed-line-count ceiling vs the committed baseline
      # (coverage-baseline.json) — the dark may not grow. Total percent is
      # reported, never gated. See scripts/ci/coverage_gate.py (RFC-006).
      - name: No coverage regressions vs baseline
        run: python scripts/ci/coverage_gate.py
