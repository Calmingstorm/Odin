# RFC-005 type-safety ratchet — checker config (see docs/plans/type-safety-plan.md).
# Default (non-strict) mode campaign-wide; per-package strictness flips land in
# P5 as [mypy-src.<pkg>.*] override blocks, never a global switch.
# scripts/ci/type_gate.py applies THIS file (HEAD's copy) to both the head tree
# and the merge-base worktree, so gate comparisons are like-for-like even on
# the PR that introduces or changes this config.

[mypy]
python_version = 3.12
plugins = pydantic.mypy
show_error_codes = True
pretty = False

# --- Optional-extra and unstubbed third-party imports -----------------------
# Policy: per-module overrides only — never a global ignore_missing_imports.
# A new unstubbed dependency must be added here consciously, in a reviewed PR.
# First-party unresolved imports (e.g. a dead "src.setup") are NOT masked:
# they stay visible as baseline findings.

# PyMuPDF ([pdf] extra; imported lazily where used)
[mypy-fitz.*]
ignore_missing_imports = True

# [browser] extra
[mypy-playwright.*]
ignore_missing_imports = True

# [voice] extra
[mypy-davey.*]
ignore_missing_imports = True

[mypy-discord.ext.voice_recv.*]
ignore_missing_imports = True

[mypy-websockets.*]
ignore_missing_imports = True

# Installed but ships no py.typed marker
[mypy-sqlite_vec.*]
ignore_missing_imports = True
