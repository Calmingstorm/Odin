<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <listen>unix:path=/workspace/run/bus</listen>
  <auth>EXTERNAL</auth>
  <servicedir>/runtime/assets/services</servicedir>
  <policy context="default">
    <allow user="desktop"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
  </policy>
  <limit name="max_message_size">2097152</limit>
  <limit name="max_completed_connections">128</limit>
  <limit name="service_start_timeout">2000</limit>
</busconfig>
