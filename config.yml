# Customize timezone to match your deployment environment
timezone: UTC

discord:
  token: ${DISCORD_TOKEN}
  allowed_users: []
  channels: []
  respond_to_bots: true
  require_mention: true
  # Add bot IDs to ignore here (e.g., - "123456789012345678")
  ignore_bot_ids: []

openai_codex:
  enabled: true
  # ChatGPT-account Codex backend only supports the GPT-5 family
  # (gpt-4o et al return "model not supported" via this auth path).
  model: gpt-5.6-sol
  # Reasoning effort sent with every main-provider request:
  # none | low | medium | high | xhigh | max (backend default: medium).
  # "max" is gpt-5.6-family only — config load rejects a known-incompatible
  # model/effort pair (e.g. gpt-5.5 + max) rather than 400 on every request.
  reasoning_effort: xhigh
  # Effort for spawned-agent iterations only. Unset/null = inherit
  # reasoning_effort ("none" is a real effort level, not inherit). Set to
  # "auto" to let the spawner choose the effort per spawn from the catalogue.
  # Read at call time — live changes reach in-flight agents next iteration.
  agent_reasoning_effort: auto
  # Model for spawned-agent iterations only. Unset/null = inherit model; a
  # specific model = fixed; "auto" = let the spawner choose per spawn.
  # Read at call time — live changes reach in-flight agents next iteration.
  agent_model: auto
  credentials_path: ./data/codex_auth.json
  # Streaming transport timeouts. request_timeout_seconds is a generous
  # whole-request backstop (long high-effort reasoning turns stream past
  # 10 minutes); stream_stall_timeout_seconds fails the stream fast when
  # no bytes arrive for that long (dead connection) instead of waiting
  # out the backstop.
  request_timeout_seconds: 3600
  stream_stall_timeout_seconds: 180
  retry:
    max_retries: 3
    base_delay: 1.0
    max_delay: 30.0
  connection_pool:
    max_connections: 10
    keepalive_timeout: 30
  context_compression:
    enabled: true
    # null = auto: the ceiling derives from the active model's input budget
    # (a number only lowers the derived target, never raises it)
    max_context_chars: null
    keep_recent_iterations: 30
  # Auxiliary model: when enabled, a cheaper Codex model runs the background
  # jobs (compaction, reflection, consolidation, background follow-up) with
  # automatic fallback to the primary model on error. It shares the main Codex
  # OAuth credentials; only the model differs. Editable live from the WebUI.
  auxiliary:
    enabled: true
    model: gpt-5.6-terra

ollama:
  enabled: false
  base_url: http://127.0.0.1:11434
  model: llama3.1:8b
  max_tokens: 4096
  timeout: 300
  # api_key: ""  # Optional bearer token for remote Ollama instances

kimi:
  enabled: false
  api_key: ""  # Moonshot AI API key from platform.kimi.ai
  model: kimi-k2.6
  max_tokens: 4096

# Which LLM backend to use: "codex", "ollama", or "kimi"
llm_provider:
  active_provider: codex

context:
  directory: ./data/context

sessions:
  max_history: 50
  max_age_hours: 24
  persist_directory: ./data/sessions
  token_budget: 256000
  adaptive_compaction: true
  # Archives are kept indefinitely; pruned oldest-first only past these caps
  archive_max_bytes: 2147483648
  archive_max_files: 10000
  # Max estimated tokens of session history per LLM request (per-channel
  # overrides: context_budget_overrides: {"<channel_id>": 131072})
  context_token_budget: 64000

tools:
  enabled: true
  # Working directory for local user commands (run_command, run_script,
  # run_command_multi, background processes, skill run_on_host). A bare
  # relative path in a command resolves HERE, not in the install directory —
  # which is what stopped an extracted archive's `rm -rf data` from deleting
  # Odin's own live state. Must be an absolute path, owned by the service
  # account, mode 0700, and outside the install and data directories.
  # Provisioned automatically on start; if it is unusable, local commands
  # refuse to run rather than falling back to the install directory.
  local_working_dir: /var/lib/odin-workspace
  # Customize SSH key path for your deployment
  ssh_key_path: /app/.ssh/id_ed25519
  # Customize SSH known hosts path for your deployment
  ssh_known_hosts_path: /app/.ssh/known_hosts
  # Managed live in WebUI System → Hosts (this file remains durable truth).
  # Existing address/ssh_user/os-only entries remain legacy-trusted through
  # ssh_known_hosts_path. New enrollments pin public host keys per host.
  # Add hosts here manually, e.g.:
  #   my-host:
  #     address: example.invalid
  #     ssh_user: root
  #     os: linux
  #     port: 22
  #     description: "Staging build host"
  #     enabled: true
  # Optional explicit default for omitted-host system work. YAML order is not policy.
  default_host: localhost
  # Break-glass TOFU enrollment stays disabled unless explicitly enabled.
  allow_host_tofu: false
  hosts:
    localhost:
      address: 127.0.0.1
      ssh_user: root
      os: linux
      description: "Local Odin workspace"
  command_timeout_seconds: 300
  tool_timeouts: {}
  audit_log_path: ./data/audit.jsonl
  trajectory_path: ./data/trajectories
  max_tool_iterations_chat: 500
  max_tool_iterations_loop: 500
  branch_freshness:
    enabled: true
  skill_allowed_urls:
    - "http://localhost:8188"
  # Built-in tools removed from the model catalog for this installation.
  # Managed from the WebUI Tools page (Capabilities → Tools); a disabled
  # tool is invisible to the model and rejected at dispatch. Unknown names
  # are preserved and ignored. Default: all built-ins enabled.
  disabled_tools: []

webhook:
  enabled: false
  secret: ''
  channel_id: ''
  gitea_channel_id: ''
  grafana_channel_id: ''
  github_channel_id: ''
  gitlab_channel_id: ''

# Agent autonomy limits — controls spawned sub-agents and scheduled agents
agents:
  max_nesting_depth: 2
  max_children_per_agent: 3
  # Maximum concurrently running agents per Discord channel. This is checked
  # for each new spawn; lowering it does not stop agents already running.
  max_concurrent_agents: 5
  # LLM iterations (turns) per agent before forced completion
  max_iterations: 120              # interactive spawns
  scheduled_max_iterations: 180    # scheduled workflow spawns (higher for autonomous coding)
  hard_max_iterations: 300         # absolute ceiling for per-spawn overrides
  # Inject budget warnings at these remaining-iteration counts
  final_warning_iterations: [20, 10, 5, 1]
  # Per-LLM-call backstop (seconds). Must exceed a legitimate high-effort
  # generation (5-10+ min at high reasoning effort) — the streaming transport
  # already fails dead connections fast, so this only bounds a hung call.
  iteration_timeout_seconds: 900
  # Hard per-agent deadline (seconds). Snapshotted at spawn: config changes
  # never move the deadline of an agent already mid-run.
  max_lifetime_seconds: 14400

# Bot personality — preset or custom identity/voice
personality:
  preset: odin                  # Built-in: "odin", "heimdall", "mist", "syn"
  custom_name: ''               # Override display name (empty = use preset)
  custom_identity: ''           # Override identity description
  custom_voice: ''              # Override voice/tone description
  user_presets: {}              # Named custom presets: { name: { identity: ..., voice: ... } }

# Attachment handling limits
attachments:
  temp_directory: /tmp/odin-attachments
  inline_text_max_bytes: 100000
  preview_max_chars: 12000
  large_preview_chars: 4000
  archive_max_bytes: 52428800         # 50 MB
  archive_max_files: 500
  archive_extract_max_bytes: 209715200  # 200 MB
  archive_preview_total_chars: 20000
  archive_preview_file_max_bytes: 64000
  image_max_bytes: 5242880            # 5 MB
  pdf_max_bytes: 26214400             # 25 MB
  retention_hours: 24

# Audit log integrity — HMAC signing for audit.jsonl entries
# Generate a key with: openssl rand -hex 32
# Enabling on an existing install is safe: history written before enablement
# is not retroactively signed — /api/audit/verify reports it as
# unsigned_prefix and verifies the chain from the first signed entry on.
audit:
  hmac_key: ''  # Set a secret to enable HMAC-SHA256 signing; empty = disabled

learning:
  enabled: true
  max_entries: 150
  consolidation_target: 120
  injection_token_budget: 4000
  # Loop reflection: dedup/cooldown so repeated identical failures teach once
  loop_reflection_enabled: true
  loop_reflection_cooldown_hours: 12.0
  loop_reflection_max_per_hour: 10

# Pure instrumentation — records prompt assembly + failure metadata,
# never influences behavior. Safe to disable per piece.
observability:
  context_trace:
    enabled: true
    memory_key_mode: hash   # raw | hash | redacted
    include_segment_ids: true
    max_trace_bytes: 16384
  audit_failure_classification: true
  prompt_budget_accounting: true
  # Record the user request on trajectory turns (capped + secret-scrubbed)
  trajectory_user_content: true
  max_user_content_chars: 4000
  # Trajectory + context-trace coverage for autonomous loop iterations
  loop_trace: true
  # Storage cap per tool result persisted into trajectory iterations
  max_tool_result_chars: 2000

# Email tools (SMTP/IMAP with App Password)
email:
  enabled: false
  smtp:
    host: smtp.gmail.com
    port: 587
    username: ''
    password: ''
    from_address: ''
  imap:
    host: imap.gmail.com
    port: 993
    username: ''
    password: ''
  max_body_chars: 50000
  max_results: 50
  max_attachment_bytes: 10485760
  connect_timeout_seconds: 30
  allowed_attachment_dirs: []

search:
  enabled: true
  search_db_path: ./data/search

logging:
  level: INFO
  directory: ./data/logs

usage:
  directory: ./data/usage

browser:
  enabled: true
  # Leave empty for native Playwright (launches local Chromium — no sidecar needed).
  # Set a ws:// URL to connect to a remote CDP browser instead.
  # cdp_url: ws://some-browserless-host:3000?token=secret
  cdp_url: ""
  # Allow browser tools to access specific local/private URLs (bypasses SSRF block).
  # Use for validating local WebUI, dev servers, etc.
  allow_private_targets:
    - "http://127.0.0.1:3000"
    - "http://localhost:3000"

permissions:
  default_tier: admin
  tiers: {}

comfyui:
  enabled: true
  url: http://localhost:8188

# Image generation backend selection.
#   auto    (default): follow the active chat provider — on 'codex' use native
#            OpenAI when NO size is requested (ComfyUI is the pre-generation
#            fallback); ANY explicit size, a negative prompt, or a checkpoint
#            routes to ComfyUI (only it honors those); on any other provider use
#            ComfyUI only. If neither is available the tool hides.
#   openai : native OpenAI only (rides the current Codex auth; Codex-provider
#            only; an explicit size or ComfyUI-only field is rejected).
#   comfyui: ComfyUI only.
# Native OpenAI ignores the requested size and returns backend-selected dimensions.
image:
  backend: auto
  openai:
    enabled: true          # kill switch for the native wire implementation
    outer_model: gpt-5.5   # Responses model hosting the image tool (pinned, not the chat model)
    image_model: gpt-image-2

# Web UI and API — all web configuration lives here (not in .env)
web:
  enabled: true
  port: 3000        # Web UI and API port (default: 3000)
  api_token: ''     # Set a token to require auth; empty = no auth (dev mode)
  session_timeout_minutes: 0  # 0 = no timeout
  api_tokens: []              # List of per-token identities; see docs

# Discord reaction triggers — fire scheduler triggers when users react with emoji
reaction_triggers:
  enabled: false
  # Restrict to specific channels (empty = all channels)
  channel_ids: []
  # Restrict to specific users (empty = all users)
  allowed_user_ids: []

# Discord message triggers — fire scheduler triggers when users send messages
# Matching is configured per-schedule trigger (content_contains, content_regex, starts_with, equals, author_id, channel_id)
# All specified fields must match (AND logic). Bot messages are always ignored.
message_triggers:
  enabled: false
  # Restrict to specific channels (empty = all channels)
  channel_ids: []
  # Restrict to specific users (empty = all users)
  allowed_user_ids: []

